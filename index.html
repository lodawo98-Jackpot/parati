<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
    <style>
        /* Encendido secuencial de "Hola Naty" */
        .greetings-sequential > span:nth-child(1) { animation-delay: 0s; }
        .greetings-sequential > span:nth-child(2) { animation-delay: .2s; }
        .greetings-sequential > span:nth-child(3) { animation-delay: .4s; }
        .greetings-sequential > span:nth-child(4) { animation-delay: .6s; }
        .greetings-sequential > span:nth-child(5) { animation-delay: .8s; }
        .greetings-sequential > span:nth-child(6) { animation-delay: 1s; }
        .greetings-sequential > span:nth-child(7) { animation-delay: 1.2s; }
        .greetings-sequential > span:nth-child(8) { animation-delay: 1.4s; }
        .greetings-sequential > span:nth-child(9) { animation-delay: 1.6s; }
    </style>
</head>

<body>
    <div class="greetings greetings-sequential">
        <span>H</span>
        <span>o</span>
        <span>l</span>
        <span>a</span>
        <span> </span>
        <span>N</span>
        <span>a</span>
        <span>t</span>
        <span>y</span>
    </div>
    <div class="description">
        <span>ESTE DETALLE ES PARA TI :)</span>
    </div>
    <div class="button">
        <button class="botones">
            <a href="flower.html" style="color: #fff;">CLICK AQUÍ</a>
        </button>
    </div>

</body>

</html>
